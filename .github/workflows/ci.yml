name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install cryptography
      - name: Python compiles
        run: python -m compileall -q proxy.py mirror_*.py tools tests
      - name: Undefined names
        run: python tools/check_names.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: for f in *.js themes/*.js themes/*/*.js games/*.js; do node --check "$f" || exit 1; done
      - name: Secret and personal-data scan
        run: python tools/scan_secrets.py
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
