<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirror Health</title>
<style>
:root { --bg:#0b0a14; --card:#171526; --tx:#f4f2ff; --dim:#9a97b8; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
* { box-sizing:border-box; } body { margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--tx); font:16px/1.4 -apple-system,'Segoe UI',Roboto,sans-serif; max-width:640px; margin:0 auto; }
h1 { font-size:26px; margin:6px 0 2px; } .sub { color:var(--dim); margin-bottom:16px; }
.sum { padding:16px 20px; border-radius:18px; font-weight:800; font-size:20px; margin-bottom:14px; } .sum.ok { background:#12301f; color:var(--ok); } .sum.bad { background:#3a1717; color:var(--bad); } .sum.warn { background:#3a2e10; color:var(--warn); }
.row { display:flex; gap:12px; align-items:center; background:var(--card); border-radius:14px; padding:12px 16px; margin-bottom:8px; } .dot { width:14px; height:14px; border-radius:50%; flex:none; } .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
.row .t { font-weight:700; } .row .d { color:var(--dim); font-size:14px; }
.btns { display:flex; gap:10px; margin-top:16px; } button { flex:1; font:inherit; font-weight:800; border:0; border-radius:14px; padding:14px; background:#ff5a8a; color:#fff; cursor:pointer; } button.alt { background:#2a2745; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#fff; color:#111; padding:12px 20px; border-radius:30px; font-weight:700; opacity:0; transition:.25s; } .toast.on { opacity:1; }
</style></head><body>
<h1>Mirror health</h1><div class="sub" id="at">checking…</div>
<div id="sum" class="sum">…</div><div id="rows"></div>
<div class="btns"><button class="alt" id="bk">Back up now</button><button id="rs">Restart mirror server</button></div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function toast(m) { $('toast').textContent = m; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 3000); }
async function load() {
  try { const d = await (await fetch('/mirror/health')).json(); const bad = d.checks.filter(c => !c.ok), warn = d.checks.filter(c => c.ok && c.warn);
    $('sum').className = 'sum ' + (bad.length ? 'bad' : warn.length ? 'warn' : 'ok'); $('sum').textContent = bad.length ? bad.length + ' thing' + (bad.length > 1 ? 's' : '') + ' need attention' : warn.length ? 'Working, with ' + warn.length + ' warning' + (warn.length > 1 ? 's' : '') : 'Everything is working';
    $('rows').innerHTML = d.checks.map(c => `<div class="row"><div class="dot ${!c.ok ? 'bad' : c.warn ? 'warn' : 'ok'}"></div><div><div class="t">${esc(c.label)}</div><div class="d">${esc(c.detail)}</div></div></div>`).join('');
    $('at').textContent = 'Updated ' + new Date().toLocaleTimeString() + (d.games ? ' · a game is running' : ''); } catch (e) { $('sum').className = 'sum bad'; $('sum').textContent = 'The mirror server is not answering'; }
}
async function act(path, body) { try { const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); const j = await r.json(); toast(j.msg || j.error || 'Done'); } catch (e) { toast('No answer'); } setTimeout(load, 1500); }
$('bk').onclick = () => act('/mirror/backup');
$('rs').onclick = () => { if (confirm('Restart the mirror server? The screen reloads in about 10 seconds.')) act('/mirror/restart'); };
load(); setInterval(load, 5000);
</script></body></html>
