<!doctype html>
<!-- The README banner and GitHub social preview (1280 x 640). Re-render after new screenshots:
     google-chrome --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1280,640 --screenshot=docs/assets/banner.png docs/assets/banner.html -->
<html><head><meta charset="utf-8"><style>
  html, body { margin:0; width:1280px; height:640px; overflow:hidden; }
  body { position:relative; font-family:Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; color:#f6f4ff;
    background:radial-gradient(700px 520px at 8% 0%, rgba(139,92,255,.38), transparent 70%), radial-gradient(760px 560px at 100% 100%, rgba(255,79,139,.32), transparent 70%),
      radial-gradient(500px 400px at 70% 10%, rgba(255,179,71,.16), transparent 70%), #07060f; }
  .left { position:absolute; left:72px; top:0; bottom:0; width:560px; display:flex; flex-direction:column; justify-content:center; }
  .logo { width:520px; margin-left:-34px; }
  h1 { margin:18px 0 0; font-size:40px; line-height:1.18; font-weight:800; letter-spacing:-.5px; }
  .tags { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
  .tags span { font-size:18px; font-weight:700; padding:8px 16px; border-radius:20px; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.14); color:#d9d4f5; }
  .foot { margin-top:30px; font-size:18px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:#8f88b3; }
  .mirror { position:absolute; right:250px; top:52px; width:300px; height:533px; border-radius:30px; padding:9px; background:linear-gradient(135deg, #8b5cff, #ff4f8b 55%, #ffb347);
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(255,79,139,.25); transform:rotate(-3deg); }
  .mirror img { width:100%; height:100%; border-radius:22px; display:block; object-fit:cover; }
  .phone { position:absolute; right:56px; top:150px; width:214px; height:463px; border-radius:36px; padding:8px; background:#16131f; border:2px solid rgba(255,255,255,.18);
    box-shadow:0 30px 70px rgba(0,0,0,.65); transform:rotate(4deg); }
  .phone img { width:100%; height:100%; border-radius:29px; display:block; object-fit:cover; }
</style></head><body>
  <div class="left">
    <img class="logo" src="logo-dark.svg" alt="OpenMirror">
    <h1>The smart mirror you drive with a game controller</h1>
    <div class="tags"><span>🎵 Party jukebox</span><span>📱 Guest phone app</span><span>🏈 Live sports</span><span>💡 Home Assistant</span><span>🎨 Themes</span></div>
    <div class="foot">Open source · No cloud account</div>
  </div>
  <div class="mirror"><img src="screens/home.png" alt=""></div>
  <div class="phone"><img src="screens/phone.png" alt=""></div>
</body></html>
